[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bonsoir"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "comet11x", email = "comet11x@protonmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/comet11x/bonsoir#readme"
Issues = "https://github.com/comet11x/bonsoir/issues"
Source = "https://github.com/comet11x/bonsoir"

[tool.hatch.version]
path = "src/bonsoir/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/bonsoir tests}"

[tool.coverage.run]
source_pkgs = ["bonsoir", "tests"]
branch = true
parallel = true
omit = [
  "src/bonsoir/__about__.py",
]

[tool.coverage.paths]
bonsoir = ["src/bonsoir", "*/bonsoir/src/bonsoir"]
tests = ["tests", "*/bonsoir/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
